<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเลือกตั้งตัวแทนพนักงาน</title>
    
    <!-- CSS Framework & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Alerts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* พื้นหลังเว็บเป็นสีฟ้าเข้ม (Blue-900) */
        body { font-family: 'Sarabun', sans-serif; background-color: #1e3a8a; -webkit-tap-highlight-color: transparent; }
        
        /* Safe Area for iPhone X+ */
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Custom Styles for Selection */
        .candidate-card { 
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s; 
            border: 2px solid transparent; 
            touch-action: manipulation;
        }
        /* Active State: เหลืองเข้มขึ้น */
        .candidate-card:active { transform: scale(0.98); background-color: #fde047; /* Yellow-300 */ }
        
        /* Selected State: ขอบฟ้าเข้ม พื้นเหลืองสดใส */
        .candidate-card.selected { 
            border-color: #1e40af; /* Blue-800 */
            background-color: #fef08a; /* Yellow-200 */
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.4), 0 2px 4px -1px rgba(30, 58, 138, 0.2);
        }
        .check-icon { opacity: 0; transition: opacity 0.2s; transform: scale(0.5); }
        .candidate-card.selected .check-icon { opacity: 1; transform: scale(1); }

        /* Loader: สีฟ้า/เหลือง */
        .loader {
            border: 3px solid #fefce8; /* Yellow-50 */
            border-top: 3px solid #facc15; /* Yellow-400 */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Progress Bar Animation */
        .progress-bar { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-blue-900">

    <!-- Navbar: ฟ้าเข้ม (Darker Blue) ตัดกับ Text เหลืองอ่อน -->
    <nav class="bg-blue-950 text-yellow-50 shadow-md sticky top-0 z-40 safe-pt border-b border-blue-800">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-vote-yea text-xl text-yellow-300"></i>
                <span class="text-lg font-bold">เลือกตัวแทน คปอ.</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <div id="user-badge" class="hidden text-xs bg-blue-800 bg-opacity-80 px-3 py-1.5 rounded-full items-center shadow-sm border border-blue-600 text-yellow-100">
                    <i class="fas fa-user mr-1.5 text-yellow-300"></i><span id="display-empid" class="font-mono"></span>
                </div>
                <!-- Summary Button (Hidden) -->
                <button onclick="toggleSummary()" class="hidden p-2 rounded-full hover:bg-blue-800 transition relative group text-yellow-100">
                    <i class="fas fa-chart-pie text-lg"></i>
                    <span class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap z-50">ดูผลคะแนน</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-lg md:max-w-5xl mb-24">
        
        <!-- View 1: Login Screen -->
        <div id="view-login" class="flex flex-col items-center justify-center min-h-[70vh] fade-in">
            <!-- Login Card: สีเหลืองอ่อน (Yellow-50) -->
            <div class="bg-yellow-50 p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center border-4 border-blue-800">
                <div class="mb-6">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 ring-4 ring-blue-200">
                        <i class="fas fa-id-card text-2xl text-blue-800"></i>
                    </div>
                    <h2 class="text-xl font-bold text-blue-900">เลือกตัวแทน คปอ.</h2>
                    <p class="text-blue-600 text-sm mt-1">กรอกรหัสพนักงานเพื่อเริ่มโหวต</p>
                </div>
                
                <div class="space-y-4">
                    <!-- Input: พื้นขาว Text ฟ้าเข้ม -->
                    <input type="text" id="input-empid" 
                           class="w-full px-4 py-3.5 border-2 border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-600 outline-none transition text-center text-lg font-semibold tracking-wide placeholder-blue-300 bg-white text-blue-900"
                           placeholder="ระบุรหัสพนักงาน"
                           inputmode="text"
                           autocomplete="off"
                           onkeypress="handleEnter(event)">
                    
                    <!-- Button: สีฟ้าเข้ม (Blue-800) -->
                    <button onclick="login()" 
                            class="w-full bg-blue-800 hover:bg-blue-700 active:bg-blue-900 text-yellow-50 font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center space-x-2 touch-manipulation border-b-4 border-blue-950 active:border-b-0 active:translate-y-1">
                        <span>ตรวจสอบสิทธิ์</span>
                        <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                </div>
                <div class="mt-6 text-xs text-blue-800 bg-blue-50 py-2 rounded-lg border border-blue-100 font-medium">
                    <i class="fas fa-database mr-1 text-blue-600"></i> ตรวจสอบสิทธิ์โดยตรงจากฐานข้อมูล
                </div>
            </div>
        </div>

        <!-- View 2: Voting Screen -->
        <div id="view-voting" class="hidden pb-safe">
            <div class="text-center mb-6">
                <!-- Text on Dark Background: สีขาว/เหลืองอ่อน -->
                <h1 class="text-2xl font-bold text-yellow-50">เลือกตัวแทน คปอ.</h1>
                <p class="text-sm text-blue-200 mt-1">แตะที่รายชื่อเพื่อเลือก (1 ท่าน)</p>
            </div>

            <!-- Loading State -->
            <div id="loading-spinner" class="flex flex-col items-center justify-center my-10 space-y-3">
                <div class="loader"></div>
                <p class="text-sm text-yellow-100">กำลังโหลดรายชื่อ...</p>
            </div>

            <!-- Candidates Grid: Mobile = 1 col, Tablet/PC = Grid -->
            <div id="candidates-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-5">
                <!-- Javascript will inject content here -->
            </div>
        </div>

        <!-- View 3: Summary Screen -->
        <div id="view-summary" class="hidden pb-safe fade-in">
            <!-- Modal: สีเหลืองอ่อน -->
            <div class="bg-yellow-50 rounded-2xl shadow-2xl border-2 border-blue-800 overflow-hidden">
                <div class="bg-blue-900 text-yellow-50 p-4 flex justify-between items-center border-b border-blue-700">
                    <h2 class="text-lg font-bold"><i class="fas fa-chart-bar mr-2 text-yellow-300"></i> สรุปผลคะแนน</h2>
                    <button onclick="closeSummary()" class="text-blue-300 hover:text-white transition">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <div class="p-6">
                    <div class="flex justify-between items-end mb-4">
                        <p class="text-sm text-blue-800 font-medium">ผลคะแนนล่าสุด (Real-time)</p>
                        <button onclick="loadSummaryData()" class="text-blue-600 text-sm hover:underline"><i class="fas fa-sync-alt mr-1"></i> รีเฟรช</button>
                    </div>

                    <div id="summary-list" class="space-y-6">
                        <!-- Summary items will be injected here -->
                        <div class="flex justify-center py-8 text-blue-300">
                            <div class="loader w-6 h-6 border-2 border-blue-200 border-t-blue-600"></div>
                        </div>
                    </div>
                </div>
                <div class="bg-blue-50 px-6 py-4 text-center text-xs text-blue-500 border-t border-blue-100">
                    * ผลคะแนนอย่างไม่เป็นทางการ
                </div>
            </div>
        </div>

    </main>

    <!-- Floating Submit Bar (Mobile Friendly) -->
    <!-- Bar: สีเหลืองอ่อน เพื่อให้เด่นบนพื้นฟ้าเข้ม -->
    <div id="submit-bar" class="fixed bottom-0 left-0 w-full bg-yellow-50 border-t-4 border-blue-600 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.3)] transform translate-y-full transition-transform duration-300 z-50 safe-pb">
        <div class="container mx-auto px-4 py-3 md:py-4 flex flex-row justify-between items-center max-w-5xl">
            <div class="flex flex-col pr-4 overflow-hidden">
                <span class="text-xs text-blue-600 font-bold uppercase tracking-wider">คุณเลือก:</span>
                <div class="font-bold text-blue-900 text-lg truncate" id="selected-name">None</div>
            </div>
            <!-- Submit Button: ฟ้าเข้ม -->
            <button onclick="confirmVote()" 
                    class="bg-blue-800 active:bg-blue-900 text-yellow-50 font-bold py-2.5 px-6 rounded-lg shadow-md transition whitespace-nowrap flex items-center border-b-4 border-blue-950 active:border-b-0 active:translate-y-0.5">
                <span>ยืนยัน</span>
                <i class="fas fa-check ml-2"></i>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURATION
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0NQQ0oiDnVF3Xyw62c2evZyKanfKIF3THTezBcAoSqCQ5hNReyhqhK8amrZAKmFPtzA/exec"; 

        // 💾 ข้อมูลจำลอง (Mock Data)
        const MOCK_DATA = [
            { id: 1, name: "นายสมชาย มุ่งมั่น", dept: "IT Support", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix", votes: 45 },
            { id: 2, name: "นางสาววิไล ใจดี", dept: "HR Manager", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka", votes: 32 },
            { id: 3, name: "นายประดิษฐ์ คิดไว", dept: "Marketing", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Bob", votes: 28 },
            { id: 4, name: "คุณสุดา พาเพลิน", dept: "Accounting", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Suda", votes: 15 }
        ];

        // ==========================================
        // 🧠 STATE MANAGEMENT
        // ==========================================
        let currentUser = null;
        let selectedCandidate = null;
        let candidatesData = [];
        let lastViewId = 'view-login';

        window.onload = () => {
            if(!GOOGLE_SCRIPT_URL) {
                console.warn("No Script URL provided. Running in Demo Mode.");
            }
        };

        function handleEnter(e) {
            if (e.key === 'Enter') login();
        }

        // ==========================================
        // 🔐 LOGIN LOGIC (UPDATED: NO CACHE, DIRECT SHEET CHECK)
        // ==========================================
        async function login() {
            const input = document.getElementById('input-empid');
            const empId = input.value.trim().toUpperCase();

            if (!empId) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณากรอกรหัส',
                    text: 'ช่องรหัสพนักงานห้ามว่าง',
                    confirmButtonText: 'ตกลง',
                    customClass: { confirmButton: 'bg-blue-800 text-white' }
                });
                return;
            }

            // หมายเหตุ: ยกเลิกการตรวจสอบ Local Storage ตามความต้องการ
            // เพื่อให้ตรวจสอบจาก Sheet โดยตรงเท่านั้น

            // เริ่มการตรวจสอบสิทธิ์กับ Server
            Swal.fire({
                title: 'กำลังตรวจสอบสิทธิ์...',
                text: 'กำลังตรวจสอบข้อมูลจากฐานข้อมูล',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                if (GOOGLE_SCRIPT_URL) {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: 'check_auth',
                            empId: empId
                        })
                    });

                    const result = await response.json();

                    // ตรวจสอบสถานะที่ส่งกลับมาจาก Sheet
                    if (result.status === 'success') {
                        // --- ผ่านการตรวจสอบ (มีสิทธิ์ และยังไม่เคยโหวต) ---
                        currentUser = empId;
                        const userName = result.name || empId;
                        
                        document.getElementById('display-empid').innerText = `${userName}`;
                        
                        Swal.close();
                        input.blur();
                        
                        // เปลี่ยนหน้า
                        switchView('view-voting');
                        document.getElementById('user-badge').classList.remove('hidden');
                        document.getElementById('user-badge').classList.add('flex');

                        loadCandidates();

                    } else if (result.status === 'duplicate' || result.status === 'already_voted') {
                        // --- เคยใช้สิทธิ์ไปแล้ว (แจ้งเตือนทันที) ---
                        Swal.fire({
                            icon: 'warning',
                            title: 'คุณใช้สิทธิ์ไปแล้ว',
                            text: 'ระบบพบข้อมูลการโหวตของคุณในฐานข้อมูลแล้ว',
                            confirmButtonText: 'ตกลง',
                            customClass: { confirmButton: 'bg-yellow-600 text-white' }
                        });

                    } else {
                        // --- ไม่พบข้อมูล หรือ ไม่มีสิทธิ์ ---
                        Swal.fire({
                            icon: 'error',
                            title: 'ไม่มีสิทธิ์โหวต',
                            text: 'ไม่พบรหัสพนักงานนี้ในระบบ หรือไม่มีสิทธิ์โหวต',
                            confirmButtonText: 'ลองใหม่',
                            customClass: { confirmButton: 'bg-red-700 text-white' }
                        });
                    }
                } else {
                    // Demo Mode (Offline)
                    await new Promise(r => setTimeout(r, 1000));
                    // ในโหมด Demo ให้ผ่านหมด แต่เตือน
                    Swal.fire({
                        icon: 'info',
                        title: 'โหมดสาธิต (Demo)',
                        text: 'ข้ามการตรวจสอบสิทธิ์จริง (เนื่องจากไม่ได้เชื่อมต่อ Server)',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        currentUser = empId;
                        document.getElementById('display-empid').innerText = currentUser;
                        input.blur();
                        switchView('view-voting');
                        document.getElementById('user-badge').classList.remove('hidden');
                        document.getElementById('user-badge').classList.add('flex');
                        loadCandidates();
                    });
                }
            } catch (error) {
                console.error("Auth Error:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถเชื่อมต่อระบบตรวจสอบสิทธิ์ได้',
                    confirmButtonText: 'ตกลง',
                    customClass: { confirmButton: 'bg-blue-800 text-white' }
                });
            }
        }

        // ==========================================
        // 📺 VIEW NAVIGATION
        // ==========================================
        function switchView(viewId) {
            ['view-login', 'view-voting', 'view-summary'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            
            if (viewId !== 'view-summary') {
                lastViewId = viewId;
            }
        }

        function toggleSummary() {
            const summaryView = document.getElementById('view-summary');
            if (summaryView.classList.contains('hidden')) {
                switchView('view-summary');
                loadSummaryData();
            } else {
                closeSummary();
            }
        }

        function closeSummary() {
            switchView(lastViewId || 'view-login');
        }

        // ==========================================
        // 📡 DATA FETCHING
        // ==========================================
        async function loadCandidates() {
            const spinner = document.getElementById('loading-spinner');

            try {
                if (GOOGLE_SCRIPT_URL) {
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        candidatesData = result.data;
                    } else {
                        throw new Error(result.message);
                    }
                } else {
                    await new Promise(r => setTimeout(r, 800));
                    candidatesData = MOCK_DATA;
                }
            } catch (error) {
                console.warn("Fetch Error encountered, switching to Mock Data:", error.message);
                candidatesData = MOCK_DATA; 
            } finally {
                spinner.classList.add('hidden');
                renderCandidates();
            }
        }

        async function loadSummaryData() {
            const container = document.getElementById('summary-list');
            container.innerHTML = '<div class="flex justify-center py-8 text-blue-200"><div class="loader w-6 h-6 border-2"></div></div>';

            let data = [];
            
            try {
                if (GOOGLE_SCRIPT_URL) {
                    // Add timestamp to prevent caching
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=summary&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if(result.status === 'success' && result.data) {
                        data = result.data;
                        
                        // Check if backend logic is updated (check if votes property exists)
                        if (data.length > 0 && typeof data[0].votes === 'undefined') {
                            console.warn("Backend missing vote counts. Please update Code.gs to latest version.");
                        }
                    } else {
                        console.log("Backend error or no data");
                        data = [];
                    }
                } else {
                    await new Promise(r => setTimeout(r, 600));
                    // Regenerate random votes for demo effect
                    data = MOCK_DATA.map(c => ({...c, votes: c.votes || Math.floor(Math.random() * 100)}));
                }
            } catch (e) {
                console.warn("Summary fetch error", e);
                // On error, show empty or mock
                data = MOCK_DATA.map(c => ({...c, votes: 0})); 
            }

            renderSummary(data);
        }

        // ==========================================
        // 🎨 UI RENDERING
        // ==========================================
        function renderCandidates() {
            const grid = document.getElementById('candidates-grid');
            grid.innerHTML = '';

            candidatesData.forEach(c => {
                const card = document.createElement('div');
                // Card: พื้นเหลืองอ่อน (Yellow-50)
                card.className = `candidate-card bg-yellow-50 rounded-xl shadow-lg p-4 cursor-pointer relative overflow-hidden group flex md:flex-col items-center gap-4 md:gap-2 border-2 border-transparent`;
                card.onclick = () => selectCandidate(c);
                card.id = `card-${c.id}`;

                const imgSrc = c.img || `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=random`;

                card.innerHTML = `
                    <div class="absolute top-0 left-0 bg-blue-800 text-yellow-50 text-sm font-bold px-3 py-1 rounded-br-xl shadow-sm z-10 border-b border-r border-blue-900">
                        No. ${c.id}
                    </div>

                    <div class="absolute top-2 right-2 check-icon text-blue-700 bg-yellow-200 rounded-full p-1 z-10 shadow-sm">
                        <i class="fas fa-check-circle text-xl"></i>
                    </div>
                    
                    <div class="flex-shrink-0 pt-1 md:pt-4">
                        <img src="${imgSrc}" alt="${c.name}" class="w-16 h-16 md:w-24 md:h-24 rounded-full object-cover border-2 border-white shadow-md bg-blue-100">
                    </div>
                    
                    <div class="flex-grow text-left md:text-center min-w-0">
                        <h3 class="text-base md:text-lg font-bold text-blue-900 leading-tight truncate pr-6 md:pr-0">${c.name}</h3>
                        <span class="inline-block mt-1 bg-blue-50 text-blue-600 text-xs px-2 py-0.5 rounded-md truncate max-w-full border border-blue-100 font-medium">${c.dept}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderSummary(data) {
            const container = document.getElementById('summary-list');
            container.innerHTML = '';

            if (data.length === 0) {
                 container.innerHTML = '<div class="text-center text-blue-400 py-4">ไม่พบข้อมูลคะแนน</div>';
                 return;
            }

            // Sort by votes descending
            data.sort((a, b) => (b.votes || 0) - (a.votes || 0));
            
            const maxVotes = Math.max(...data.map(d => d.votes || 0)) || 1;

            data.forEach((c, index) => {
                const voteCount = c.votes || 0;
                const percent = (voteCount / maxVotes) * 100;
                const isWinner = index === 0 && voteCount > 0;
                
                const item = document.createElement('div');
                item.className = 'relative';
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-blue-400 w-5">#${index + 1}</span>
                            <span class="font-semibold text-blue-900 text-sm truncate max-w-[150px]">${c.name}</span>
                        </div>
                        <span class="text-sm font-bold ${isWinner ? 'text-blue-700' : 'text-gray-500'}">${voteCount} คะแนน</span>
                    </div>
                    <div class="w-full bg-blue-100 rounded-full h-2.5 overflow-hidden">
                        <div class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                    </div>
                `;
                container.appendChild(item);

                // Animate bar
                setTimeout(() => {
                    item.querySelector('.progress-bar').style.width = `${percent}%`;
                    // Gold color for winner
                    if(isWinner) {
                        const bar = item.querySelector('.progress-bar');
                        bar.classList.remove('bg-blue-600');
                        bar.classList.add('bg-yellow-500'); 
                    }
                }, 100);
            });
        }

        function selectCandidate(candidate) {
            selectedCandidate = candidate;
            document.querySelectorAll('.candidate-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(`card-${candidate.id}`).classList.add('selected');
            
            const bar = document.getElementById('submit-bar');
            bar.classList.remove('translate-y-full');
            document.getElementById('selected-name').innerText = `No.${candidate.id} - ${candidate.name}`;
        }

        // ==========================================
        // 🚀 SUBMIT VOTE
        // ==========================================
        function confirmVote() {
            if (!selectedCandidate || !currentUser) return;5867050201

            Swal.fire({
                title: 'ยืนยัน?',
                text: `คุณเลือก "No.${selectedCandidate.id} ${selectedCandidate.name}"`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#1e40af', // Blue-800
                cancelButtonColor: '#9ca3af',
                confirmButtonText: 'ใช่, โหวตเลย',
                cancelButtonText: 'ยกเลิก',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    submitToBackend();
                }
            });
        }

        async function submitToBackend() {
            Swal.fire({
                title: 'กำลังบันทึก...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            const payload = {
                action: 'vote',
                empId: currentUser,
                candidateId: selectedCandidate.id
            };

            try {
                if (GOOGLE_SCRIPT_URL) {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();

                    if (result.status === 'success') {
                        finishVoting(true);
                    } else if (result.status === 'duplicate') {
                        Swal.fire('ผิดพลาด', 'คุณเคยโหวตไปแล้ว', 'error');
                    } else {
                        throw new Error(result.message || 'Unknown error');
                    }
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                    finishVoting(true);
                }
            } catch (error) {
                console.error("Submit Error:", error);
                if (GOOGLE_SCRIPT_URL) {
                     Swal.fire('เชื่อมต่อไม่ได้', 'กรุณาลองใหม่อีกครั้ง', 'error');
                } else {
                    finishVoting(true); 
                }
            }
        }

        function finishVoting(success) {
            if (success) {
                // REMOVED: ไม่บันทึก localStorage แล้ว เพื่อให้ระบบต้องเช็คใหม่ทุกครั้งถ้าเข้าใหม่
                
                document.getElementById('submit-bar').classList.add('translate-y-full');
                
                const votingView = document.getElementById('view-voting');
                votingView.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 px-4 fade-in text-center h-full">
                        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                            <i class="fas fa-check text-4xl text-blue-800"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-yellow-50 mb-2">บันทึกเรียบร้อย</h2>
                        <p class="text-blue-200 mb-8">ขอบคุณสำหรับการโหวต</p>
                        
                        <div class="w-full max-w-xs bg-yellow-50 p-4 rounded-xl shadow-lg border border-blue-800 flex items-center space-x-3 mx-auto">
                            <div class="flex-shrink-0 font-bold text-xl text-blue-300 mr-2">#${selectedCandidate.id}</div>
                            <img src="${selectedCandidate.img || 'https://via.placeholder.com/50'}" class="w-12 h-12 rounded-full bg-gray-200 object-cover border border-blue-200">
                            <div class="text-left overflow-hidden">
                                <p class="text-sm text-gray-500">คุณเลือก</p>
                                <p class="font-bold text-blue-900 truncate">${selectedCandidate.name}</p>
                            </div>
                        </div>

                        <button onclick="location.reload()" class="mt-12 text-blue-300 hover:text-white transition text-sm flex items-center">
                            <i class="fas fa-redo mr-2"></i> กลับหน้าหลัก
                        </button>
                    </div>
                `;
                
                Swal.close();
            }
        }
    </script>
</body>
