<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเลือกตั้งตัวแทนพนักงาน</title>
    
    <!-- CSS Framework & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Alerts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1e3a8a; -webkit-tap-highlight-color: transparent; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        .candidate-card { 
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s; 
            border: 2px solid transparent; 
            touch-action: manipulation;
        }
        .candidate-card:active { transform: scale(0.98); background-color: #fde047; }
        .candidate-card.selected { 
            border-color: #1e40af;
            background-color: #fef08a;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.4), 0 2px 4px -1px rgba(30, 58, 138, 0.2);
        }
        .check-icon { opacity: 0; transition: opacity 0.2s; transform: scale(0.5); }
        .candidate-card.selected .check-icon { opacity: 1; transform: scale(1); }
        .loader {
            border: 3px solid #fefce8;
            border-top: 3px solid #facc15;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-blue-900">

    <nav class="bg-blue-950 text-yellow-50 shadow-md sticky top-0 z-40 safe-pt border-b border-blue-800">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-vote-yea text-xl text-yellow-300"></i>
                <span class="text-lg font-bold">เลือกตัวแทน คปอ.</span>
            </div>
            <div class="flex items-center space-x-3">
                <div id="user-badge" class="hidden text-xs bg-blue-800 bg-opacity-80 px-3 py-1.5 rounded-full items-center shadow-sm border border-blue-600 text-yellow-100">
                    <i class="fas fa-user mr-1.5 text-yellow-300"></i><span id="display-empid" class="font-mono"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-lg md:max-w-5xl mb-24">
        
        <!-- View 1: Login -->
        <div id="view-login" class="flex flex-col items-center justify-center min-h-[70vh] fade-in">
            <div class="bg-yellow-50 p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center border-4 border-blue-800">
                <div class="mb-6">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 ring-4 ring-blue-200">
                        <i class="fas fa-id-card text-2xl text-blue-800"></i>
                    </div>
                    <h2 class="text-xl font-bold text-blue-900">เลือกตัวแทน คปอ.</h2>
                    <p class="text-blue-600 text-sm mt-1">กรอกรหัสพนักงานเพื่อเริ่มโหวต</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="input-empid" 
                           class="w-full px-4 py-3.5 border-2 border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-600 outline-none transition text-center text-lg font-semibold tracking-wide placeholder-blue-300 bg-white text-blue-900"
                           placeholder="ระบุรหัสพนักงาน"
                           inputmode="text"
                           autocomplete="off"
                           onkeypress="handleEnter(event)">
                    <button onclick="login()" 
                            class="w-full bg-blue-800 hover:bg-blue-700 active:bg-blue-900 text-yellow-50 font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center space-x-2 touch-manipulation border-b-4 border-blue-950 active:border-b-0 active:translate-y-1">
                        <span>ตรวจสอบสิทธิ์</span>
                        <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                </div>
                <div class="mt-6 text-xs text-blue-800 bg-blue-50 py-2 rounded-lg border border-blue-100 font-medium">
                    <i class="fas fa-shield-alt mr-1 text-blue-600"></i> ตรวจสอบสิทธิ์จากฐานข้อมูล Google Sheets
                </div>
            </div>
        </div>

        <!-- View 2: Voting -->
        <div id="view-voting" class="hidden pb-safe">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-yellow-50">เลือกตัวแทน คปอ.</h1>
                <p class="text-sm text-blue-200 mt-1">แตะที่รายชื่อเพื่อเลือก (1 ท่าน)</p>
            </div>
            <div id="loading-spinner" class="flex flex-col items-center justify-center my-10 space-y-3">
                <div class="loader"></div>
                <p class="text-sm text-yellow-100">กำลังโหลดรายชื่อ...</p>
            </div>
            <div id="candidates-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-5"></div>
        </div>

    </main>

    <!-- Floating Submit Bar -->
    <div id="submit-bar" class="fixed bottom-0 left-0 w-full bg-yellow-50 border-t-4 border-blue-600 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.3)] transform translate-y-full transition-transform duration-300 z-50 safe-pb">
        <div class="container mx-auto px-4 py-3 md:py-4 flex flex-row justify-between items-center max-w-5xl">
            <div class="flex flex-col pr-4 overflow-hidden">
                <span class="text-xs text-blue-600 font-bold uppercase tracking-wider">คุณเลือก:</span>
                <div class="font-bold text-blue-900 text-lg truncate" id="selected-name">None</div>
            </div>
            <button onclick="confirmVote()" 
                    class="bg-blue-800 active:bg-blue-900 text-yellow-50 font-bold py-2.5 px-6 rounded-lg shadow-md transition whitespace-nowrap flex items-center border-b-4 border-blue-950 active:border-b-0 active:translate-y-0.5">
                <span>ยืนยัน</span>
                <i class="fas fa-check ml-2"></i>
            </button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0NQQ0oiDnVF3Xyw62c2evZyKanfKIF3THTezBcAoSqCQ5hNReyhqhK8amrZAKmFPtzA/exec"; 

        let currentUser = null;
        let selectedCandidate = null;
        let candidatesData = [];

        function handleEnter(e) {
            if (e.key === 'Enter') login();
        }

        async function login() {
            const input = document.getElementById('input-empid');
            const empId = input.value.trim().toUpperCase();

            if (!empId) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณากรอกรหัส',
                    text: 'ช่องรหัสพนักงานห้ามว่าง',
                    confirmButtonText: 'ตกลง',
                    customClass: { confirmButton: 'bg-blue-800 text-white' }
                });
                return;
            }

            // ลบการตรวจสอบ localStorage ออก เพื่อให้เช็คจากชีตทุกครั้ง
            // ระบบจะอาศัย backend (Google Script) เป็นคนตอบว่า "เคยโหวตแล้ว" แทน

            Swal.fire({
                title: 'กำลังตรวจสอบสิทธิ์...',
                text: 'กรุณารอสักครู่',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: 'check_auth',
                        empId: empId
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // ตรวจสอบว่าเคยโหวตไปแล้วหรือยังจากชีต
                    if (result.voted === true) {
                        Swal.fire({
                            icon: 'error',
                            title: 'คุณใช้สิทธิ์ไปแล้ว',
                            text: 'รหัสพนักงานนี้ได้ทำการลงคะแนนเรียบร้อยแล้ว ไม่สามารถโหวตซ้ำได้',
                            confirmButtonText: 'รับทราบ',
                            customClass: { confirmButton: 'bg-gray-600 text-white' }
                        });
                        return;
                    }

                    currentUser = empId;
                    const userName = result.name || empId;
                    document.getElementById('display-empid').innerText = `${userName}`;
                    
                    Swal.close();
                    input.blur();
                    switchView('view-voting');
                    document.getElementById('user-badge').classList.remove('hidden');
                    document.getElementById('user-badge').classList.add('flex');
                    loadCandidates();

                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'ไม่พบข้อมูล',
                        text: result.message || 'รหัสพนักงานนี้ไม่มีสิทธิ์โหวต หรือข้อมูลไม่ถูกต้อง',
                        confirmButtonText: 'ลองใหม่',
                        customClass: { confirmButton: 'bg-red-700 text-white' }
                    });
                }
            } catch (error) {
                console.error("Auth Error:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถเชื่อมต่อระบบตรวจสอบสิทธิ์ได้ กรุณาลองใหม่ภายหลัง',
                    confirmButtonText: 'ตกลง',
                    customClass: { confirmButton: 'bg-blue-800 text-white' }
                });
            }
        }

        function switchView(viewId) {
            ['view-login', 'view-voting'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function loadCandidates() {
            const spinner = document.getElementById('loading-spinner');
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const result = await response.json();
                if (result.status === 'success') {
                    candidatesData = result.data;
                }
            } catch (error) {
                console.warn("Fetch Error:", error.message);
            } finally {
                spinner.classList.add('hidden');
                renderCandidates();
            }
        }

        function renderCandidates() {
            const grid = document.getElementById('candidates-grid');
            grid.innerHTML = '';
            candidatesData.forEach(c => {
                const card = document.createElement('div');
                card.className = `candidate-card bg-yellow-50 rounded-xl shadow-lg p-4 cursor-pointer relative overflow-hidden flex items-center gap-4 border-2 border-transparent`;
                card.onclick = () => selectCandidate(c);
                card.id = `card-${c.id}`;
                const imgSrc = c.img || `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=random`;
                card.innerHTML = `
                    <div class="absolute top-0 left-0 bg-blue-800 text-yellow-50 text-xs font-bold px-2 py-0.5 rounded-br-lg z-10">No. ${c.id}</div>
                    <div class="absolute top-2 right-2 check-icon text-blue-700 bg-yellow-200 rounded-full p-1 z-10 shadow-sm"><i class="fas fa-check-circle text-xl"></i></div>
                    <img src="${imgSrc}" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm bg-blue-100">
                    <div class="flex-grow text-left">
                        <h3 class="text-base font-bold text-blue-900 leading-tight truncate">${c.name}</h3>
                        <span class="inline-block mt-1 bg-blue-50 text-blue-600 text-[10px] px-1.5 py-0.5 rounded border border-blue-100 font-medium">${c.dept}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectCandidate(candidate) {
            selectedCandidate = candidate;
            document.querySelectorAll('.candidate-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(`card-${candidate.id}`).classList.add('selected');
            document.getElementById('submit-bar').classList.remove('translate-y-full');
            document.getElementById('selected-name').innerText = `No.${candidate.id} - ${candidate.name}`;
        }

        function confirmVote() {
            if (!selectedCandidate || !currentUser) return;
            Swal.fire({
                title: 'ยืนยันการโหวต?',
                text: `คุณเลือก "No.${selectedCandidate.id} ${selectedCandidate.name}"`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#1e40af',
                cancelButtonColor: '#9ca3af',
                confirmButtonText: 'ยืนยัน',
                cancelButtonText: 'ยกเลิก',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) submitToBackend();
            });
        }

        async function submitToBackend() {
            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const payload = { action: 'vote', empId: currentUser, candidateId: selectedCandidate.id };
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    finishVoting();
                } else {
                    Swal.fire('ผิดพลาด', result.message || 'บันทึกไม่สำเร็จ', 'error');
                }
            } catch (error) {
                Swal.fire('เกิดข้อผิดพลาด', 'กรุณาลองใหม่อีกครั้ง', 'error');
            }
        }

        function finishVoting() {
            // ลบการเก็บลง localStorage ออก เพื่อให้ทุกอย่างอ้างอิงจากชีตอย่างเดียว
            document.getElementById('submit-bar').classList.add('translate-y-full');
            const votingView = document.getElementById('view-voting');
            votingView.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 px-4 fade-in text-center h-full">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                        <i class="fas fa-check text-4xl text-blue-800"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-yellow-50 mb-2">บันทึกเรียบร้อย</h2>
                    <p class="text-blue-200 mb-8">ขอบคุณสำหรับการโหวต</p>
                    <button onclick="location.reload()" class="text-blue-300 hover:text-white transition text-sm flex items-center">
                        <i class="fas fa-redo mr-2"></i> กลับหน้าหลัก
                    </button>
                </div>
            `;
            Swal.close();
        }
    </script>
</body>
</html>
